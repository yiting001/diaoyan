services:
  backend:
    build: ./backend
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
    volumes:
      - ./data:/data
    expose:
      - "3000"

  web:
    build: ./frontend
    restart: always
    ports:
      - "127.0.0.1:8180:80"
    depends_on:
      - backend
